<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10,000,000</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="crosshair"></div>
    <div id="controls-hint">WASD = MOVE • MOUSE = LOOK • CLICK / SPACE = ATTACK • F = FLASHLIGHT</div>

    <div id="hud">
      <div class="stat">ZONE <b id="hud-zone">BLACK MARKET RING</b></div>
      <div class="stat">CONDITION 
        <div class="hpbar"><div class="hpfill" id="hud-hp"></div></div>
      </div>
      <div class="stat" style="color:var(--gold)">PRIZE: <b id="hud-hits">$10,000,000</b></div>
    </div>

    <div id="screen-title" class="overlay">
      <div class="title-main">10,000,000</div>
      <div class="title-sub">WASHED-UP MMA FIGHTER vs THE BLACK MARKET ABYSS</div>
      <button class="btn" id="btn-start">SIGN CONTRACT</button>
    </div>

    <div id="screen-dialogue" class="overlay hidden">
      <div class="title-sub" id="dialogue-label">— CONTRACT LOG —</div>
      <p id="dialogue-text"></p>
      <button class="btn" id="btn-dialogue-next">CONTINUE</button>
    </div>
  </div>

  <script src="cutscenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
