<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.5D Retro Horror Engine</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      user-select: none;
    }
    #gl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      pointer-events: none;
      z-index: 10;
    }
    #zone-display {
      font-size: 18px;
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 5px;
    }
    #health-bar-container {
      width: 200px;
      height: 16px;
      background: #222;
      border: 2px solid #fff;
      margin-top: 8px;
    }
    #health-bar {
      width: 100%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.2s ease;
    }
    #banner-message {
      position: absolute;
      top: 18%;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      color: #ff3333;
      padding: 12px 0;
      display: none;
      z-index: 20;
    }
    #captain-bubble {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.9);
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 16px;
      color: #ffffff;
      border-radius: 4px;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <canvas id="gl-canvas"></canvas>

  <div id="hud">
    <div id="zone-display">SHIP DECK</div>
    <div>FLASHLIGHT: <span id="fl-status">OFF</span> [F]</div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
  </div>

  <div id="banner-message"></div>
  <div id="captain-bubble"></div>

  <script type="module" src="./cutscenes.js"></script>
</body>
</html>
