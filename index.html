<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.5D Doom Style Horror Maze</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: monospace;
      color: white;
    }
    #gl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      pointer-events: none;
    }
    #health-bar-container {
      width: 200px;
      height: 16px;
      background: #333;
      border: 2px solid #fff;
    }
    #health-bar {
      width: 100%;
      height: 100%;
      background: #00ffcc;
    }
    #banner-message {
      position: absolute;
      top: 20%;
      width: 100%;
      text-align: center;
      font-size: 24px;
      background: rgba(0,0,0,0.7);
      padding: 10px 0;
      display: none;
    }
    #captain-bubble {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #fff;
      padding: 10px 20px;
      font-size: 18px;
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="gl-canvas"></canvas>

  <div id="hud">
    <div id="zone-display">SHIP DECK</div>
    <div>FLASHLIGHT: <span id="fl-status">OFF</span> (Press F)</div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
  </div>

  <div id="banner-message"></div>
  <div id="captain-bubble"></div>

  <script type="module" src="./cutscenes.js"></script>
</body>
</html>
