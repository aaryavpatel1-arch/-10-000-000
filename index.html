<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Maze Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gl-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="zone-display">ZONE: SHIP DECK</div>
    <div id="top-hint">STRIKE THE DUMMY 5 TIMES TO PREPARE</div>
    
    <div class="bar-container">
      <span class="bar-label">HP:</span>
      <div class="bar-bg"><div id="health-bar"></div></div>
    </div>

    <div class="battery-container">
      <span class="bar-label">FLASHLIGHT (F):</span>
      <span id="fl-status">OFF (100%)</span>
    </div>
  </div>

  <div id="start-screen">
    <h1>THE LIVING MAZE</h1>
    <button id="start-btn">CLICK TO PLAY</button>
  </div>

  <script type="module">
    import { initGame } from './cutscenes.js';
    document.getElementById('start-btn').addEventListener('click', () => {
      initGame();
    });
  </script>
</body>
</html>
